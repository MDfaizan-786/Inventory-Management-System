spring.application.name=Inventory-Management-System

# Database connection URL
# localhost = MySQL is running on your own computer
# 3306 = Default MySQL port number
# inventory_db = Name of the database you want to connect to
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db

# MySQL username used to log in to the database
spring.datasource.username=root

# MySQL password
# Replace YOUR_MYSQL_PASSWORD with your actual MySQL password
spring.datasource.password=faizan123


# Automatically update/create the database tables based on your Java entity classes
# For example, if you create a new entity class, Hibernate can create its table
# "update" tries to preserve existing data while updating the schema
spring.jpa.hibernate.ddl-auto=update


# Display SQL queries executed by Hibernate in the console
# For example: SELECT * FROM products
spring.jpa.show-sql=true

# Format SQL queries to make them easier to read
# Queries will appear with proper indentation and line breaks
spring.jpa.properties.hibernate.format_sql=true


# Enable DEBUG-level logging for Hibernate SQL statements
# Shows the SQL queries Hibernate executes against the database
logging.level.org.hibernate.SQL=DEBUG

# Show the values Hibernate binds to SQL query parameters
# Useful for understanding which values are inserted, updated, or searched
# Example: INSERT INTO products (name) VALUES ('Laptop')
logging.level.org.hibernate.orm.jdbc.bind=TRACE
